<!doctype html>
<meta charset="utf-8">
<title>Ortet stale completion replacement</title>
<style>
  html, body { margin: 0; min-height: 400px; color: #f9f4e8; background: #185d8c; font: 22px sans-serif; }
  main { padding: 28px; }
  html.complete, html.complete body { background: #17324d; }
</style>
<main>
  <h1 id="state">Ortet O5 replacement waiting</h1>
  <p>The late result from the replaced session must never arrive here.</p>
</main>
<script>
  // The server releases the former document's delayed fetch after five seconds. This
  // legitimate new-document timer completes later, leaving time to reject it.
  setTimeout(function () {
    document.documentElement.className = "complete";
    document.getElementById("state").textContent = "Ortet O5 stale completion rejected";
  }, 6000);
</script>
