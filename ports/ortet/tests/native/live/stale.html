<!doctype html>
<meta charset="utf-8">
<title>Ortet stale completion source</title>
<style>
  html, body { margin: 0; min-height: 400px; color: #f9f4e8; background: #17324d; font: 22px sans-serif; }
  main { padding: 28px; }
  a { display: block; width: 260px; margin-top: 28px; padding: 18px; color: #17324d; background: #d8e6dc; border: 4px solid #5b3b78; }
</style>
<main>
  <h1 id="state">Ortet O5 stale source waiting</h1>
  <a href="/replacement.html?case=stale">Open replacement document</a>
</main>
<script>
  fetch("/late-stale?case=stale")
    .then(function (response) { return response.text(); })
    .then(function () {
      document.documentElement.className = "stale-complete";
      document.getElementById("state").textContent = "Ortet O5 stale completion leaked";
    });
</script>
