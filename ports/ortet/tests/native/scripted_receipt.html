<!doctype html>
<meta charset="utf-8">
<title>Ortet scripted native receipt</title>
<style>
  html, body { margin: 0; min-height: 400px; color: #17324d; background: #f9f4e8; font: 20px sans-serif; }
  body { box-sizing: border-box; padding: 24px; }
  html.complete, html.complete body { background: #d09b5b; }
  #activate { box-sizing: border-box; width: 300px; height: 100px; padding: 30px;
              background: #d8e6dc; border: 5px solid #5b3b78; }
  h1 { color: #8a2f24; border-bottom: 3px solid #d09b5b; }
</style>
<div id="activate">Native click starts the receipt task</div>
<h1 id="state">Ortet O5 native receipt pending</h1>
<script>
  // The external script must observe this parser-time mutation before it may
  // schedule the completion task.
  document.body.dataset.inlineReady = "yes";
</script>
<script src="scripted_receipt.js"></script>
