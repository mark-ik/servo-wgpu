<!doctype html>
<meta charset="utf-8">
<title>Ortet standards compositing receipt</title>
<style>
  html, body { margin: 0; width: 320px; height: 200px; overflow: hidden;
    background: rgb(255 255 255); font: 12px sans-serif; }
  canvas { display: block; position: absolute; image-rendering: pixelated; }
  #source { left: 8px; top: 8px; width: 40px; height: 30px; }
  #dom-over-source { position: absolute; z-index: 1; left: 18px; top: 18px;
    width: 20px; height: 15px; background: rgb(0 0 255 / 50%); }
  #canvas-opacity { left: 8px; top: 48px; width: 40px; height: 30px; opacity: .5; }
  #group { position: absolute; left: 70px; top: 8px; width: 70px; height: 50px;
    opacity: .5; }
  #group-canvas { left: 0; top: 0; width: 60px; height: 40px; }
  #group-sibling { position: absolute; left: 20px; top: 10px; width: 30px;
    height: 20px; background: rgb(0 0 255); }
  #clip { position: absolute; box-sizing: border-box; left: 160px; top: 8px;
    width: 70px; height: 50px; padding: 6px; border: 4px solid rgb(20 20 20);
    overflow: hidden; transform: translate(5px, 0) scale(1); }
  #clip-canvas { left: 20px; top: 8px; width: 50px; height: 25px;
    transform-origin: 0 0; transform: translate(10px, 0) scale(1.25); }
  #boxed { left: 8px; top: 112px; width: 50px; height: 40px;
    box-sizing: content-box; border: 4px solid rgb(20 20 20); padding: 4px; }
  #nested-outer { position: absolute; left: 160px; top: 110px; width: 100px;
    height: 70px; overflow: hidden; background: white; transform-origin: 0 0;
    transform: translate(5px, 0) scale(1.25); }
  #nested-inner { position: absolute; left: 10px; top: 10px; width: 60px;
    height: 50px; overflow: hidden; background: white; }
  #nested-canvas { left: 30px; top: 20px; width: 40px; height: 30px;
    transform-origin: 0 0; transform: translate(5px, 0) scale(1.5); }
  #edge { position: absolute; left: 300.5px; top: 120px; width: 10px;
    height: 20px; background: rgb(15 15 15); }
  #state { position: absolute; left: 8px; top: 86px; margin: 0; padding: 2px 4px;
    color: white; background: rgb(20 40 60); font: 12px sans-serif; }
</style>
<canvas id="source" width="40" height="30"></canvas>
<div id="dom-over-source"></div>
<canvas id="canvas-opacity" width="40" height="30"></canvas>
<div id="group">
<canvas id="group-canvas" width="60" height="40"></canvas>
  <div id="group-sibling"></div>
</div>
<div id="clip"><canvas id="clip-canvas" width="50" height="25"></canvas></div>
<canvas id="boxed" width="32" height="24"></canvas>
<div id="nested-outer"><div id="nested-inner"><canvas id="nested-canvas" width="40" height="30"></canvas></div></div>
<div id="edge"></div>
<h1 id="state">standards receipt pending</h1>
<script src="standards_compositing_receipt.js"></script>
