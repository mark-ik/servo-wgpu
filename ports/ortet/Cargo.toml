[package]
name = "ortet"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
publish.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "The raw Genet host: one window, one document, no chrome — the reference individual of the engine."

[lib]
name = "ortet"
path = "src/lib.rs"
bench = false
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "ortet"
path = "src/main.rs"
bench = false

[dependencies]
# The session contracts ortet drives: SessionEngine, DocumentSession, the
# neutral input vocabulary.
document-session-api = { workspace = true }
# ResourceFetcher / ResourceResponse and host-owned href resolution.
genet-host-api = { workspace = true }
# The Livery lane as a session engine. Ortet needs the engine half only; no
# reader lane, no smolweb, no controller.
genet-documents = { workspace = true, features = ["livery"] }
genet-document-resources = { workspace = true }
# The target-neutral present core. Native and web hosts own their distinct
# target/input adapters below.
genet-render-host = { workspace = true }
netrender = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
accesskit = { workspace = true }
genet-winit-host = { path = "../../components/genet-winit-host" }
# http(s) for the fallback fetch lane, over netfetcher's default transport on a
# background tokio runtime this host owns. Local addresses never reach it.
netfetcher = { path = "../../components/netfetcher" }
tokio = { workspace = true, features = ["rt", "rt-multi-thread"] }
url = { workspace = true }
winit = { workspace = true }
wgpu = { workspace = true }
# The receipt artifact. `png` alone: ortet writes RGBA8 and reads nothing.
png = "0.18"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.127"
wasm-bindgen-futures = "=0.4.77"
js-sys = "=0.3.104"
wgpu = { workspace = true, features = ["webgpu"] }
web-sys = { version = "=0.3.104", features = [
    "Document", "DomRect", "Element", "Event", "EventTarget", "Headers", "Response",
    "ReadableStream", "ReadableStreamDefaultReader",
    "FocusEvent", "HtmlCanvasElement", "HtmlElement", "KeyboardEvent", "MouseEvent",
    "PointerEvent", "WheelEvent", "Window", "console",
] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)', 'cfg(llvm_pgo)'] }
