[package]
name = "netrender-smoke"
version = "0.1.0"
edition = "2024"
publish = false

# Standalone project — intentionally NOT a genet workspace member.
# The genet workspace Cargo.toml patches webrender from a path that no
# longer exists (the directory was renamed to netrender in netrender commit
# c9481b04b); that patch failure blocks the full workspace. This example proves
# the netrender embedder hookup independently, without Servo.
#
# Build:
#   cargo run --manifest-path examples/netrender_smoke/Cargo.toml
# from genet/ root.

[[bin]]
name = "netrender-smoke"
path = "src/main.rs"

[workspace]

[dependencies]
# netrender lives in the sibling netrender/ workspace. Git dep (not a path dep)
# so this standalone example clones-and-builds anywhere; a local netrender
# checkout is picked up via the gitignored `.cargo/config.toml` `paths` override.
netrender = { git = "https://github.com/merely-made/netrender.git", rev = "c77b0be84fb6fc28a3c1602a2b1637f7d913acc0" }
wgpu = "30"
pollster = "0.4"

# netrender pulls vello, and upstream vello 0.10 still requires wgpu 29.
# Patches are per-workspace-root and this example is its own root, so it
# restates genet's redirect to the owned wgpu-30 fork. Retires when a
# wgpu-30 vello ships upstream.
[patch.crates-io]
vello = { git = "https://github.com/mark-ik/vello.git", tag = "vello-0.10.0" }
