[workspace]
resolver = "2"
members = [
    "components/media/examples",
    "components/shared/engine-observables-api",
    "components/shared/document-session-api",
    "components/shared/paint-types",
    "components/xpath",
    "components/webgl-wgpu",
    "components/webgl-essl",
    "components/genet-document-resources",
    "components/genet-probe",
    "components/genet-clipboard",
    "components/livery",
    "components/buckram",
    "components/genet-livery",
    "components/genet-static-dom",
    "components/genet-scripted-dom",
    "components/genet-scripted",
    "components/genet-scripted-worker",
    # Render-free live-document extraction and structured reader shapes.
    "components/fleece",
    # The content lanes as session engines (2026-07-10 session-engines plan):
    # static/scripted/smolweb retained documents, promoted out of pelt.
    "components/genet-documents",
    "components/genet-host-api",
    "components/genet-render-host",
    "components/genet-winit-host",
    "components/genet-render",
    "components/shared/layout-dom",
    "components/script-engine-api",
    # script-engine-boa joined the workspace 2026-05-25. The old blocker (boa
    # 0.21.1's icu_normalizer ~2.0 vs parley 0.9's ^2.1.1) was resolved by forking
    # boa to crates/boa (`genet` branch) and widening its icu family ~2.0 -> ^2.1,
    # which resolves to icu 2.2.0 — the version nova_vm's temporal_rs -> icu_calendar
    # chain forces, and which parley accepts. Patched in via [patch.crates-io] below.
    "components/script-engine-boa",
    "components/script-engine-nova",
    "components/script-engine-piccolo",
    "components/script-runtime-api",
    # Livery carries three Parley 0.10 extensions that downstream hosts must
    # resolve from the same source. Keeping the fork as a workspace package
    # lets git consumers name it in their own root `[patch.crates-io]`; root
    # patches are not inherited across Cargo workspaces.
    "support/patches/parley",
    # The Fetch network engine, adopted the same day: genet and mere were its only
    # consumers, and it must stay genet-side to keep mere's dependency direction
    # one-way.
    "components/netfetcher",
    # Pelt (pelt, pelt-core, pelt-desktop) and Tabard left for mere on
    # 2026-09-03, with mere-document-lanes and knot-editor-host, under the
    # platform boundary plan's consumers-first order (mere
    # design_docs/mere_docs/implementation_strategy/
    # 2026-09-02_platform_boundary_and_repository_topology_plan.md). Ortet is
    # genet's headed host from here on.
    # The Cambium family (cambium, cambium-rootstock, cambium-winit,
    # cambium-winit-a11y, cambium-genet-winit-host, cambium-genet-web-host,
    # cambium-nematic, meristem, sprigging), workbench and mere-surface-api
    # followed on 2026-09-03, under the same plan: they are application
    # composition and a reusable UI surface, not web-platform behavior. They
    # keep their published names, versions, and licenses, and speak genet's
    # DOM, host, layout, paint, accessibility and input contracts from mere
    # through downward-facing adapters. No member that stays depended on any
    # of the eleven, so they left in one commit.
    # The engine-management layer followed on 2026-09-03, under the same plan
    # and for the same reason: inker (the application-facing controller),
    # document-canvas, the scrying/graft/weld engine adapters, verso-tile,
    # nematic, illume, errand and tinct. Ten packages in one commit; every
    # reverse dependency of each was itself one of the ten, so the set was a
    # leaf. inker's engine-facing contract half stays as
    # components/shared/document-session-api (P1), which is how genet-render
    # and genet-documents reach the document contracts now. Their three doc
    # area roots (design_docs/{inker,nematic,verso}_docs) travelled with them.
    # The raw engine host: one window, one document, no Mere crate in its cone
    # (design_docs/2026-09-03_ortet_founding_plan.md).
    "ports/ortet",
    "ports/genet-wpt",
    "tests/unit/*",
]
default-members = ["ports/ortet"]
# The SpiderMonkey-backed scripting stack (components/script,
# script_bindings, and the heavy Servo subsystems: layout, net, canvas,
# constellation, devtools, metrics, storage, timers, webdriver_server,
# bluetooth, background_hang_monitor) plus its `tests/unit/script`
# (`script_tests`) were deleted 2026-05-20 — they were already cut from
# the build graph (not workspace members, not reachable from `pelt`).
# Git history is the reference for the eventual scripting rebuild. See
# docs/2026-05-20_stylo_taffy_adoption_plan.md (and the cut commit). The
# remaining Stylo + genet-layout compatibility cone was deleted 2026-08-21.
exclude = [".cargo"]

[workspace.package]
version = "0.2.0"
authors = ["The Servo Project Developers"]
repository = "https://github.com/servo/servo"
# A generic description for packages that don't have a meaningful description yet.
description = "A component of the servo web-engine."
license = "MPL-2.0"
edition = "2024"
publish = false
# We have yet to decide on a policy for updating the minimum supported Rust version.
# Before increasing this, please open a discussion on Zulip explaining the reason
# why we should consider increasing our minimum supported Rust version.
# Please also note, that the **default** Rust version in rust-toolchain.toml may be
# bumped freely.
# Skip 1.90 which causes mis-compilation: https://github.com/rust-lang/rust/issues/147265
rust-version = "1.86.0"

[workspace.dependencies]
accesskit = { version = "0.24.0", features = ["serde"] }
# Platform AccessKit adapters for the winit host bridge (genet-winit-host::a11y),
# tracking accesskit 0.24. Target-gated in the consuming crate, so a non-native
# build (wasm) never pulls them.
accesskit_windows = "0.32"
accesskit_macos = "0.26"
accesskit_unix = "0.21"
app_units = "0.7"
arboard = { git = "https://github.com/mark-ik/arboard.git", branch = "custom-formats" }
argon2 = { version = "0.5", features = ["alloc"] }
arrayvec = "0.7"
async-tungstenite = { version = "0.34", features = ["tokio-rustls-webpki-roots"] }
atomic_refcell = "0.1.14"
# aws-lc-rs removed 2026-05-15 per Mark's directive: genet should default to
# pure-Rust crypto, not aws-lc's NASM-required C+asm crypto. The only consumers
# (components/script, components/net) are now either gated out (script via
# tests/unit/script exclusion above) or already dead (net). Crypto provider
# for any future rustls revival should use `ring` (rustls feature `ring`,
# pre-built asm on Windows since ring 0.17 — no NASM needed) or
# `rustls-rustcrypto` (fully pure Rust, slower).
backtrace = "0.3"
base64 = "0.22.1"
base64ct = { version = "1.8", features = ["alloc"] }
bitflags = "2.11"
brotli = "8.0.2"
