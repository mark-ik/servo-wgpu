[package]
name = "genet-compositor"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
publish.workspace = true
rust-version.workspace = true
repository.workspace = true
description.workspace = true

[lib]
name = "genet_compositor"
path = "lib.rs"

[lints.clippy]
unwrap_used = "deny"
panic = "deny"

[dependencies]
dpi = { workspace = true }
euclid = { workspace = true }
image = { workspace = true }
log = { workspace = true }
netrender_device = { workspace = true }
paint_types = { workspace = true }
raw-window-handle = { workspace = true }
rustc-hash = { workspace = true }
wgpu = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true }

[target.'cfg(target_vendor = "apple")'.dependencies]
# macOS compositor backend (compositor_calayer.rs).
objc2 = { workspace = true }
objc2-core-foundation = { workspace = true, features = ["CFBase", "CFDictionary", "CFString", "CFNumber"] }
objc2-foundation = { workspace = true }
objc2-io-surface = { workspace = true }
objc2-quartz-core = { workspace = true }
objc2-metal = { workspace = true, features = ["MTLDevice", "MTLTexture", "MTLAllocation", "MTLResource", "objc2-io-surface"] }

[target.'cfg(target_os = "macos")'.dependencies]
# AppKit-only: `compositor_factory.rs` extracts the NSView's `CALayer` from
# `RawWindowHandle::AppKit`. iOS / iPadOS go through UIKit instead.
objc2-app-kit = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
# Wayland compositor backend (compositor_wayland/). ash matches wgpu-hal 30's
# lockfile-pinned 0.38.0+1.3.281 so the types line up.
ash = "0.38"
bytemuck = { workspace = true }
smallvec = { workspace = true }
# `system` exposes `Backend::from_foreign_display` + `ObjectId::from_ptr`, which
# adopt the embedder-owned wl_display/wl_surface from raw-window-handle.
wayland-client = { version = "0.31", features = ["system"] }
wayland-protocols = { version = "0.32", features = ["client", "unstable", "staging"] }
