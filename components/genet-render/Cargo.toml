[package]
name = "genet-render"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
publish.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Genet host render driver: neutral DOM -> owned Livery/Buckram paint list -> netrender scene, plus host spatial, caret, selection, and accessibility queries."

[lib]
name = "genet_render"
path = "src/lib.rs"

[features]
default = ["livery", "accesskit"]
livery = []
# The native bridge lowers the engine projection to AccessKit. Browser hosts
# retain that projection without linking a platform accessibility tree.
accesskit = ["dep:accesskit"]

[dependencies]
# The genet DOM + the engine pipeline this drives.
genet-scripted-dom = { path = "../genet-scripted-dom" }
genet-livery = { path = "../genet-livery" }
layout_dom_api = { workspace = true }
# Paint-list -> netrender::Scene lowering (aliased `paint`), the Scene type, and
# the paint/query value types.
paint_list_api = { workspace = true }
paint_list_render = { workspace = true }
netrender = { workspace = true }
# Engine-observable query surface: hit_test (point -> node) behind FragmentQuery.
# The introspection CONTRACT types (`ContentReport` / `OutlineEntry`) and the
# accessibility projection live in the contracts crate so `DocumentSession`
# can name them; this crate keeps the LayoutDom -> report builder and
# re-exports the types for its consumers.
document-session-api = { workspace = true }
# Accessibility tree emission: ScriptedDom -> accesskit::TreeUpdate (a host
# concern, kept out of the core layout crate).
accesskit = { workspace = true, optional = true }

[dev-dependencies]
# A parsed HTML document for the content-introspection (`inspect`) tests.
genet-static-dom = { path = "../genet-static-dom" }
