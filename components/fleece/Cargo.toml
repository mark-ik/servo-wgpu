[package]
name = "fleece"
version = "0.5.0"
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository = "https://github.com/merely-made/genet"
description = "Render-free live-document extraction into index and structured reader shapes."
readme = "README.md"
keywords = ["extraction", "readability", "content", "scraping", "dom"]
categories = ["parser-implementations", "text-processing"]

[features]
wire = ["dep:serde", "dep:serde_json"]

[dependencies]
layout_dom_api = { workspace = true }
serde = { workspace = true, features = ["derive"], optional = true }
serde_json = { workspace = true, optional = true }
sha2 = { workspace = true }
unicode-segmentation = { workspace = true }
unicode-bidi = { workspace = true }

[dev-dependencies]
genet-static-dom = { version = "0.1.0", path = "../genet-static-dom" }
