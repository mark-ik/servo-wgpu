# Boa backend for script-engine-api. Pure Rust, builds on all targets — it is the
# wasm32 scripting backend and compatibility artifact (Nova is 64-bit-target-only;
# see Appendix B in
# docs/2026-05-20_genet_script_engine_plan.md) and the native conformance oracle.
[package]
name = "script-engine-boa"
version = "0.0.0"
edition = "2021"
license = "MPL-2.0"
publish = false

[lib]
name = "script_engine_boa"
path = "lib.rs"

[dependencies]
script-engine-api = { path = "../script-engine-api" }
boa_engine = { version = "=1.0.0-dev", git = "https://github.com/mark-ik/boa.git", rev = "5a58112579cecaba6ba59d3310901992003fbb31" }
boa_gc = { version = "=1.0.0-dev", git = "https://github.com/mark-ik/boa.git", rev = "5a58112579cecaba6ba59d3310901992003fbb31" }
# Pin the published caller-provenance patch so fresh clones use the same native
# callback realm rules as local development. The gitignored local config may
# redirect these sources to crates/boa; it is not part of the public contract.
# Boa remains on the upstream 1.0.0-dev line, hence the exact prerelease version.
